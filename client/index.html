<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Workshop - Management and Booking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-orange: #c86537;
            --primary-orange-hover: #b25529;
            --bg-light: #fafafa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Header */
        .navbar {
            padding-top: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eaeaea;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-orange) !important;
            font-size: 1.4rem;
        }

        .nav-link {
            color: #333333 !important;
            font-weight: 500;
            margin: 0 10px;
        }

        .nav-link.active {
            font-weight: 700;
        }

        .btn-outline-custom {
            border: 1px solid #333333;
            color: #333333;
            border-radius: 8px;
            padding: 6px 20px;
            font-weight: 500;
        }

        .btn-outline-custom:hover {
            background-color: #f0f0f0;
            color: #333333;
        }

        .btn-orange-custom {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 20px;
            font-weight: 500;
        }

        .btn-orange-custom:hover {
            background-color: var(--primary-orange-hover);
            color: white;
        }

        /* Hero Banner Section */
        .hero-banner {
            position: relative;
            /* LƯU Ý: Thay đường dẫn ảnh của bạn vào url() bên dưới khi có ảnh */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 90px 20px;
            text-align: center;
        }

        .hero-banner h1 {
            font-size: 2.75rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero-banner p {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.95;
            margin-bottom: 0;
        }

        /* Main Content Container (Để trống sẵn) */
        main#main-content {
            flex: 1;
            padding: 40px 0;
        }

        /* Footer */
        footer {
            border-top: 1px solid #eaeaea;
            background-color: #ffffff;
            padding: 20px 0;
            color: #333333;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- 1. HEADER / NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-palette"></i> Art Workshop
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Danh sách Workshop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Đặt lịch</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-custom" data-bs-toggle="modal" data-bs-target="#loginModal">Đăng nhập</button>
                    <button class="btn btn-orange-custom">Đăng ký</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 2. HERO BANNER -->
    <header class="hero-banner">
        <div class="container">
            <h1>Khám Phá Sáng Tạo Nghệ Thuật</h1>
            <p>Tham gia các lớp workshop Làm gốm, Vẽ tranh, Nến thơm & Đồ thủ công cùng nghệ nhân</p>
        </div>
    </header>

    <!-- 3. KHU VỰC NỘI DUNG CHÍNH (Đang để trống để nhúng code sau) -->
    <main id="main-content">
        <div class="container text-center text-muted">
            <!-- Nội dung từng phân hệ sẽ được đổ vào đây khi bấm menu -->
        </div>
    </main>

    <!-- 4. FOOTER -->
    <footer class="text-center">
        <div class="container">
            Art Workshop Management and Booking
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
